{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm">

            <div class="card-header bg-warning">
                <h4 class="mb-0">Edit Student</h4>
            </div>

            <div class="card-body">

                <form method="POST">

                    <!-- Student Name -->
                    <div class="mb-3">

                        <label class="form-label">
                            Student Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ student['name'] }}"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ student['email'] }}"
                            required
                        >

                    </div>


                    <!-- Department -->
                    <div class="mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <select
                            name="department"
                            class="form-select"
                            required
                        >

                            <option value="ECE"
                                {% if student['department'] == 'ECE' %}
                                selected
                                {% endif %}>
                                ECE
                            </option>

                            <option value="CSE"
                                {% if student['department'] == 'CSE' %}
                                selected
                                {% endif %}>
                                CSE
                            </option>

                            <option value="EEE"
                                {% if student['department'] == 'EEE' %}
                                selected
                                {% endif %}>
                                EEE
                            </option>

                            <option value="MECH"
                                {% if student['department'] == 'MECH' %}
                                selected
                                {% endif %}>
                                MECH
                            </option>

                            <option value="CIVIL"
                                {% if student['department'] == 'CIVIL' %}
                                selected
                                {% endif %}>
                                CIVIL
                            </option>

                        </select>

                    </div>


                    <!-- Buttons -->
                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Update Student
                        </button>

                        <a
                            href="/"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
