{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Add New Student</h4>
            </div>

            <div class="card-body">

                <form method="POST">

                    <!-- Student Name -->
                    <div class="mb-3">
                        <label class="form-label">
                            Student Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter student name"
                            required
                        >
                    </div>


                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter email address"
                            required
                        >
                    </div>


                    <!-- Department -->
                    <div class="mb-3">
                        <label class="form-label">
                            Department
                        </label>

                        <select
                            name="department"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Department
                            </option>

                            <option value="ECE">
                                ECE
                            </option>

                            <option value="CSE">
                                CSE
                            </option>

                            <option value="EEE">
                                EEE
                            </option>

                            <option value="MECH">
                                MECH
                            </option>

                            <option value="CIVIL">
                                CIVIL
                            </option>

                        </select>
                    </div>


                    <!-- Buttons -->
                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Add Student
                        </button>

                        <a
                            href="/"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
